{% load static lang_tags %}
<!DOCTYPE html>
<html lang="{{ request.LANG|default:'id' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ profile.display_name|default:"PORTFOLIO" }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ profile.display_name|default:'' }} — {% pick profile 'headline' %}{% if profile.location %} · {{ profile.location }}{% endif %}{% endblock %}">
<meta name="theme-color" content="#0033FF">
<link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">

<!-- Open Graph / social share -->
<meta property="og:type" content="website">
<meta property="og:title" content="{% block og_title %}{{ profile.display_name|default:'PORTFOLIO' }}{% endblock %}">
<meta property="og:description" content="{% pick profile 'headline' %}">
<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/id-front.webp' %}">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:ital,wght@0,400;0,500;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header class="topbar">
  <a class="logo" href="{% url 'home' %}">{{ profile.display_name|default:"W/Y" }}_</a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">menu</button>
  <nav class="nav" id="site-nav">
    <a href="{% url 'home' %}#about">{% t 'nav_about' %}</a>
    <a href="{% url 'home' %}#work">{% t 'nav_work' %}</a>
    <a href="{% url 'home' %}#stack">{% t 'nav_stack' %}</a>
    <a href="{% url 'home' %}#contact">{% t 'nav_contact' %}</a>
    <span class="lang-toggle">
      <a href="{% url 'set_lang' 'id' %}" class="{% if request.LANG == 'id' %}active{% endif %}">ID</a><span class="sep">/</span><a href="{% url 'set_lang' 'en' %}" class="{% if request.LANG == 'en' %}active{% endif %}">EN</a>
    </span>
  </nav>
</header>

<main>
{% block content %}{% endblock %}
</main>

<script>
(function () {
  var btn = document.querySelector('.nav-toggle');
  var nav = document.getElementById('site-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  nav.addEventListener('click', function (e) {
    if (e.target.closest('a')) {
      nav.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>

</body>
</html>
